app:
  root_path: 'C:/Users/SKBA_FA/Documents/VIISAN OfficeCam'

storage:
  sqlite:
    path: "photo_jig_vision.db"

normalization:
  enabled: false
  bg_confidence_threshold: 0.90
  min_high_conf_bg_ratio: 0.05
  drift_threshold: 2.0
  low_confidence_threshold: 0.60
  max_l_shift: 25
  max_a_shift: 5
  max_b_shift: 5
  retraining_low_confidence_threshold: 0.20

folder_qc:
  analysis_id_pattern: "^[A-Z]{3}[0-9]{5}$"
  date_formats:
    - "%Y-%m-%d"
    - "%m-%d-%Y"
    - "%m-%d-%y"
  cell_folder_pattern: "^cell\\s*#\\d+$"
  valid_image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".tif"
    - ".tiff"
  customer_codes:
    H: HKMC
    F: FORD
    V: VW
    E: ESS
    S: Slate
    T: Test
  image_count_rules:
    H: 30
    F: 38
    V: 23
    E: 40
    S: null
    T: null

crop_engine:
  crop_angle_tolerance: 4.0
  size_deviation: 0.02
  pixel_count_deviation: 0.10
  crop_padding_px: 5
  source_edge_margin_px: 3
  source_edge_contact_min_px: 25
  paper_mask_hsv:
    lower: [0, 0, 200]
    upper: [180, 50, 255]
  customer_reference_ratios:
    H: 3.306
    F: 2.566
    V: 5.203

color_normalizer:
  use_lab: true
  blend_factor: 0.7
  coeff_scale_clamp: [0.8, 1.2]
  coeff_shift_clamp: [-25.0, 25.0]
  hsv_mask_margin: 5
  hsv_inactive_range:
    lower: [0, 4, 72]
    upper: [179, 164, 158]
  hsv_background_range:
    lower: [19, 155, 201]
    upper: [22, 197, 255]
  reference_inactive_mean_std:
    mean: null
    std: null
  reference_background_mean_std:
    mean: null
    std: null

ml:
  model_path: 'models/lightgbm'
  num_threads: -1
  li_salt_zone_threshold: 0.01
  png_compression_level: 1
  save_mask_images: true
  downsample_factor: 0.75
  predict_chunk_rows: 250000
  feature_extraction:
    feature_set: "baseline"
    local_residual_sigma_px: 50.0
    robust_eps: 1.0e-6
    mm_per_pixel: 1.0
    edge_band_mm: 5.0
  edge_hsv_range:
    lower: [0, 4, 72]
    upper: [177, 62, 158]
  nonactive_hsv_range:
    lower: [0, 57, 93]
    upper: [179, 164, 155]
  edge_margin_px: 25
  training:
    validation_group_by: cell
    validation_fraction: 0.2
    num_boost_round: 300
    learning_rate: 0.03
    num_leaves: 63
    max_depth: -1
    min_data_in_leaf: 20
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 0
    lambda_l1: 0.0
    lambda_l2: 0.0
    min_gain_to_split: 0.0
    max_bin: 255
    num_threads: -1
    early_stopping_rounds: 30
    seed: 0
